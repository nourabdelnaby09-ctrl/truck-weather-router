services:
  - type: web
    name: truck-weather-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python backend/manage.py migrate && gunicorn --chdir backend config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: truck-weather-frontend
          property: host

  - type: web
    name: truck-weather-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: truck-weather-api
          property: host
